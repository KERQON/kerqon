<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">KERQON security model</title><desc id="desc">KERQON security boundaries from operator through control plane and authenticated agent channel to managed node.</desc>
<defs>
    <style>
      :root{
        --bg:#0b0f14; --panel:#101720; --panel2:#131b25; --line:#243246; --lineSoft:#1a2533;
        --text:#eef3f9; --muted:#9ba8ba; --faint:#718095; --accent:#4d9fff; --ok:#4fd19a;
        --warn:#e0b260; --danger:#ef7d7d;
      }
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .bg{fill:var(--bg)} .card{fill:var(--panel);stroke:var(--line);stroke-width:1}
      .card2{fill:var(--panel2);stroke:var(--line);stroke-width:1}
      .accent-card{fill:var(--panel2);stroke:var(--accent);stroke-width:1.35}
      .future-card{fill:#0f151e;stroke:#3b4656;stroke-width:1;stroke-dasharray:5 5}
      .divider{stroke:var(--lineSoft);stroke-width:1}
      .eyebrow{fill:var(--accent);font-size:12px;font-weight:700;letter-spacing:2.3px}
      .title{fill:var(--text);font-size:30px;font-weight:740;letter-spacing:-.35px}
      .subtitle{fill:var(--muted);font-size:15px;font-weight:500}
      .h2{fill:var(--text);font-size:14px;font-weight:700}
      .h3{fill:var(--text);font-size:12.5px;font-weight:700}
      .body{fill:var(--muted);font-size:11.5px;font-weight:540}
      .tiny{fill:var(--faint);font-size:10px;font-weight:560}
      .value{fill:var(--text);font-size:11.5px;font-weight:650}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .line{fill:none;stroke:#33455d;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}
      .lineA{fill:none;stroke:#4d9fff;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
      .lineD{fill:none;stroke:#596779;stroke-width:1.1;stroke-dasharray:6 6;stroke-linecap:round}
      .junction{fill:#4d9fff}.ok{fill:var(--ok)}.warn{fill:var(--warn)}.danger{fill:var(--danger)}.accent{fill:var(--accent)}
      .chip{fill:#132033;stroke:#28486d;stroke-width:1}.chipText{fill:#aacbfa;font-size:9.6px;font-weight:650}
      .chipOk{fill:#11241d;stroke:#275845;stroke-width:1}.chipOkText{fill:#8fe1bb;font-size:9.6px;font-weight:650}
      .chipFuture{fill:#141923;stroke:#414b59;stroke-width:1;stroke-dasharray:4 4}.chipFutureText{fill:#909aab;font-size:9.6px;font-weight:650}
      .port{fill:#111923;stroke:#2a3748;stroke-width:1}.portPublic{fill:#13241d;stroke:#2a5d49;stroke-width:1}.portPrivate{fill:#211b11;stroke:#5d4825;stroke-width:1}
      .metricTrack{fill:#1b2634}.metricFill{fill:#4d9fff}.metricOk{fill:#4fd19a}
      .nodeDot{fill:#111923;stroke:#3b516f;stroke-width:1}.nodeDotA{fill:#14243a;stroke:#4d9fff;stroke-width:1.25}
      .site{fill:#0f151e;stroke:#35445a;stroke-width:1;stroke-dasharray:4 4}
      @media (prefers-color-scheme:light){
        :root{--bg:#f7f9fc;--panel:#fff;--panel2:#f5f8fc;--line:#d6e0eb;--lineSoft:#e5ebf2;--text:#101722;--muted:#536276;--faint:#76859a;--accent:#2c78df;--ok:#1f9d6c;--warn:#af7d26;--danger:#c84f4f}
        .chip{fill:#eef5ff;stroke:#c9dcf4}.chipText{fill:#215ea8}.chipOk{fill:#eef9f4;stroke:#bfe7d6}.chipOkText{fill:#177d57}
        .chipFuture{fill:#f6f8fb;stroke:#cad3de}.chipFutureText{fill:#6f7a8b}.port{fill:#f8fafc;stroke:#d8e1eb}
        .portPublic{fill:#eef9f4;stroke:#c0e5d6}.portPrivate{fill:#fff8ec;stroke:#ead6ad}.metricTrack{fill:#edf1f6}
        .line{stroke:#b6c5d7}.lineA{stroke:#4b86ca}.lineD{stroke:#a8b4c2}.future-card{fill:#fbfcfe;stroke:#c8d1dc}
        .nodeDot{fill:#fff;stroke:#c8d6e6}.nodeDotA{fill:#eef5ff;stroke:#2c78df}.site{fill:#fbfcfe;stroke:#cbd4df}
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4d9fff"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#596779"/>
    </marker>
  </defs>
<rect class="bg" width="1600" height="1000" rx="24"/>

<text class="eyebrow" x="64" y="52">KERQON SECURITY MODEL</text>
<text class="title" x="64" y="92">Central control without making every node a remote-admin endpoint.</text>
<text class="subtitle" x="64" y="121">Trust is explicit: authenticated identities, encrypted agent channels, scoped operations, verified releases and auditable results.</text>

<g transform="translate(64 200)">
 <rect class="card" width="280" height="300" rx="16"/>
 <text class="tiny" x="20" y="30">OPERATOR</text><text class="h2" x="20" y="60">Authenticated user</text>
 <line class="divider" x1="20" y1="78" x2="260" y2="78"/>
 <text class="body" x="20" y="112">identity</text><text class="value" x="132" y="112">operator</text>
 <text class="body" x="20" y="142">role / grants</text><text class="value" x="132" y="142">scoped</text>
 <text class="body" x="20" y="172">target</text><text class="value" x="132" y="172">node-01</text>
 <text class="body" x="20" y="202">operation</text><text class="value" x="132" y="202">explicit</text>
 <rect class="chipFuture" x="20" y="238" width="150" height="28" rx="14"/><text class="chipFutureText" x="47" y="256">Authorization</text>
</g>

<path class="lineA" d="M344 350 H430" marker-end="url(#arrow)"/>
<text class="tiny" x="365" y="338">request</text>

<g transform="translate(430 170)">
 <rect class="accent-card" width="360" height="360" rx="18"/>
 <text class="tiny" x="20" y="30">CONTROL PLANE</text><text class="h2" x="20" y="60">Policy &amp; operation broker</text>
 <line class="divider" x1="20" y1="78" x2="340" y2="78"/>
 <text class="body" x="20" y="112">Authenticate operator</text><circle class="ok" cx="320" cy="108" r="4"/>
 <text class="body" x="20" y="144">Authorize target + action</text><circle class="ok" cx="320" cy="140" r="4"/>
 <text class="body" x="20" y="176">Resolve agent identity</text><circle class="ok" cx="320" cy="172" r="4"/>
 <text class="body" x="20" y="208">Create scoped operation</text><circle class="ok" cx="320" cy="204" r="4"/>
 <text class="body" x="20" y="240">Record request + result</text><circle class="ok" cx="320" cy="236" r="4"/>
 <line class="divider" x1="20" y1="268" x2="340" y2="268"/>
 <g transform="translate(20 290)">
  <rect class="chipOk" width="78" height="26" rx="13"/><text class="chipOkText" x="25" y="17">mTLS</text>
  <rect class="chipOk" x="88" width="118" height="26" rx="13"/><text class="chipOkText" x="109" y="17">Agent ID</text>
  <rect class="chipFuture" x="216" width="104" height="26" rx="13"/><text class="chipFutureText" x="239" y="17">Audit</text>
 </g>
</g>

<path class="lineA" d="M790 350 H890" marker-end="url(#arrow)"/>
<path class="lineD" d="M890 380 H790" marker-end="url(#arrowMuted)"/>
<text class="tiny" x="811" y="338">scoped operation</text><text class="tiny" x="813" y="401">result / state</text>

<g transform="translate(890 170)">
 <rect class="card" width="300" height="360" rx="16"/>
 <text class="tiny" x="20" y="30">AGENT CHANNEL</text><text class="h2" x="20" y="60">Outbound initiated</text>
 <line class="divider" x1="20" y1="78" x2="280" y2="78"/>
 <text class="body" x="20" y="112">Mutual authentication</text>
 <text class="body" x="20" y="144">Encrypted transport</text>
 <text class="body" x="20" y="176">Agent-bound identity</text>
 <text class="body" x="20" y="208">Structured operations</text>
 <text class="body" x="20" y="240">Structured results</text>
 <line class="divider" x1="20" y1="268" x2="280" y2="268"/>
 <text class="tiny" x="20" y="296">No inbound KERQON management port</text>
 <text class="tiny" x="20" y="316">required on the managed node.</text>
</g>

<path class="lineA" d="M1190 350 H1256" marker-end="url(#arrow)"/>

<g transform="translate(1256 200)">
 <rect class="card" width="280" height="300" rx="16"/>
 <text class="tiny" x="20" y="30">MANAGED NODE</text><text class="h2" x="20" y="60">node-01</text>
 <line class="divider" x1="20" y1="78" x2="260" y2="78"/>
 <text class="body" x="20" y="112">Agent identity</text><text class="value" x="146" y="112">known</text>
 <text class="body" x="20" y="142">Operation target</text><text class="value" x="146" y="142">scoped</text>
 <text class="body" x="20" y="172">Execution</text><text class="value" x="146" y="172">controlled</text>
 <text class="body" x="20" y="202">Result</text><text class="value" x="146" y="202">reported</text>
 <rect class="chipOk" x="20" y="238" width="132" height="28" rx="14"/><text class="chipOkText" x="44" y="256">Authenticated</text>
</g>

<g transform="translate(64 600)">
 <rect class="card" width="460" height="216" rx="16"/>
 <text class="h2" x="20" y="32">Release trust</text><text class="tiny" x="20" y="53">SOFTWARE SUPPLY CHAIN</text>
 <line class="divider" x1="20" y1="68" x2="440" y2="68"/>
 <text class="body" x="20" y="100">Signed release metadata</text><circle class="ok" cx="420" cy="96" r="4"/>
 <text class="body" x="20" y="130">SHA-256 artifact verification</text><circle class="ok" cx="420" cy="126" r="4"/>
 <text class="body" x="20" y="160">Trusted signing keyring</text><circle class="ok" cx="420" cy="156" r="4"/>
 <text class="tiny" x="20" y="190">Verify what is deployed before execution.</text>
</g>

<g transform="translate(570 600)">
 <rect class="future-card" width="460" height="216" rx="16"/>
 <text class="h2" x="20" y="32">Operational safety</text><text class="tiny" x="20" y="53">LEAST PRIVILEGE · EXPLICIT ACTIONS</text>
 <line class="divider" x1="20" y1="68" x2="440" y2="68"/>
 <text class="body" x="20" y="100">Per-operation authorization</text>
 <text class="body" x="20" y="130">Controlled terminal sessions</text>
 <text class="body" x="20" y="160">Targeted service / route / VPN actions</text>
 <text class="tiny" x="20" y="190">Control is a product capability, not unrestricted shell access.</text>
</g>

<g transform="translate(1076 600)">
 <rect class="future-card" width="460" height="216" rx="16"/>
 <text class="h2" x="20" y="32">Auditability</text><text class="tiny" x="20" y="53">WHO · WHAT · WHERE · RESULT</text>
 <line class="divider" x1="20" y1="68" x2="440" y2="68"/>
 <text class="body" x="20" y="100">Operator identity + target node</text>
 <text class="body" x="20" y="130">Requested operation + authorization</text>
 <text class="body" x="20" y="160">Execution result + timestamp</text>
 <text class="tiny" x="20" y="190">Sensitive operations should leave an explainable trail.</text>
</g>

<g transform="translate(64 868)">
 <rect class="card2" width="1472" height="76" rx="14"/>
 <text class="tiny" x="20" y="27">SECURITY PRINCIPLE</text>
 <text class="value" x="20" y="55">Authenticated identity → authorized operation → encrypted agent channel → controlled execution → auditable result</text>
</g>

</svg>