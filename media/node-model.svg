<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1100" role="img" aria-labelledby="title desc">
  <title id="title">KERQON node model v5</title>
  <desc id="desc">KERQON deeply models a managed node, its network topology, exposure, runtime, storage and health, and enables secure centralized operations through authenticated agent channels.</desc>

  <defs>
    <style>
      :root{
        --bg:#0b0f14; --panel:#101720; --panel2:#131b25; --line:#243246; --lineSoft:#1a2533;
        --text:#eef3f9; --muted:#9ba8ba; --faint:#718095; --accent:#4d9fff; --ok:#4fd19a;
        --warn:#e0b260; --danger:#ef7d7d;
      }
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .bg{fill:var(--bg)} .card{fill:var(--panel);stroke:var(--line);stroke-width:1}
      .card2{fill:var(--panel2);stroke:var(--line);stroke-width:1}
      .accent-card{fill:var(--panel2);stroke:var(--accent);stroke-width:1.35}
      .future-card{fill:#0f151e;stroke:#3b4656;stroke-width:1;stroke-dasharray:5 5}
      .divider{stroke:var(--lineSoft);stroke-width:1}
      .eyebrow{fill:var(--accent);font-size:12px;font-weight:700;letter-spacing:2.3px}
      .title{fill:var(--text);font-size:30px;font-weight:740;letter-spacing:-.35px}
      .subtitle{fill:var(--muted);font-size:15px;font-weight:500}
      .h2{fill:var(--text);font-size:14px;font-weight:700}
      .h3{fill:var(--text);font-size:12.5px;font-weight:700}
      .body{fill:var(--muted);font-size:11.5px;font-weight:540}
      .tiny{fill:var(--faint);font-size:10px;font-weight:560}
      .value{fill:var(--text);font-size:11.5px;font-weight:650}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .line{fill:none;stroke:#33455d;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}
      .lineA{fill:none;stroke:#4d9fff;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
      .lineD{fill:none;stroke:#596779;stroke-width:1.1;stroke-dasharray:6 6;stroke-linecap:round}
      .junction{fill:#4d9fff}.ok{fill:var(--ok)}.warn{fill:var(--warn)}.danger{fill:var(--danger)}.accent{fill:var(--accent)}
      .chip{fill:#132033;stroke:#28486d;stroke-width:1}.chipText{fill:#aacbfa;font-size:9.6px;font-weight:650}
      .chipOk{fill:#11241d;stroke:#275845;stroke-width:1}.chipOkText{fill:#8fe1bb;font-size:9.6px;font-weight:650}
      .chipFuture{fill:#141923;stroke:#414b59;stroke-width:1;stroke-dasharray:4 4}.chipFutureText{fill:#909aab;font-size:9.6px;font-weight:650}
      .port{fill:#111923;stroke:#2a3748;stroke-width:1}.portPublic{fill:#13241d;stroke:#2a5d49;stroke-width:1}.portPrivate{fill:#211b11;stroke:#5d4825;stroke-width:1}
      .metricTrack{fill:#1b2634}.metricFill{fill:#4d9fff}.metricOk{fill:#4fd19a}
      .nodeDot{fill:#111923;stroke:#3b516f;stroke-width:1}.nodeDotA{fill:#14243a;stroke:#4d9fff;stroke-width:1.25}
      .site{fill:#0f151e;stroke:#35445a;stroke-width:1;stroke-dasharray:4 4}
      @media (prefers-color-scheme:light){
        :root{--bg:#f7f9fc;--panel:#fff;--panel2:#f5f8fc;--line:#d6e0eb;--lineSoft:#e5ebf2;--text:#101722;--muted:#536276;--faint:#76859a;--accent:#2c78df;--ok:#1f9d6c;--warn:#af7d26;--danger:#c84f4f}
        .chip{fill:#eef5ff;stroke:#c9dcf4}.chipText{fill:#215ea8}.chipOk{fill:#eef9f4;stroke:#bfe7d6}.chipOkText{fill:#177d57}
        .chipFuture{fill:#f6f8fb;stroke:#cad3de}.chipFutureText{fill:#6f7a8b}.port{fill:#f8fafc;stroke:#d8e1eb}
        .portPublic{fill:#eef9f4;stroke:#c0e5d6}.portPrivate{fill:#fff8ec;stroke:#ead6ad}.metricTrack{fill:#edf1f6}
        .line{stroke:#b6c5d7}.lineA{stroke:#4b86ca}.lineD{stroke:#a8b4c2}.future-card{fill:#fbfcfe;stroke:#c8d1dc}
        .nodeDot{fill:#fff;stroke:#c8d6e6}.nodeDotA{fill:#eef5ff;stroke:#2c78df}.site{fill:#fbfcfe;stroke:#cbd4df}
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4d9fff"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#596779"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="1100" rx="24"/>

  <!-- HEADER -->
  <text class="eyebrow" x="64" y="52">KERQON NODE MODEL</text>
  <text class="title" x="64" y="92">Understand deeply. Control centrally.</text>
  <text class="subtitle" x="64" y="121">One node becomes a connected infrastructure model: identity, network reachability, exposure, runtime, storage, health and secure operations.</text>

  <!-- CONTROL PLANE -->
  <g transform="translate(520 154)">
    <rect class="accent-card" width="560" height="112" rx="16"/>
    <text class="tiny" x="24" y="30">KERQON CONTROL PLANE</text>
    <text class="h2" x="24" y="58">Discover · Understand · Secure · Operate</text>
    <g transform="translate(24 76)">
      <rect class="chipOk" width="110" height="24" rx="12"/><text class="chipOkText" x="21" y="16">Authenticated</text>
      <rect class="chip" x="120" width="76" height="24" rx="12"/><text class="chipText" x="144" y="16">mTLS</text>
      <rect class="chip" x="206" width="170" height="24" rx="12"/><text class="chipText" x="231" y="16">Outbound initiated</text>
      <rect class="chipFuture" x="386" width="126" height="24" rx="12"/><text class="chipFutureText" x="410" y="16">Controlled access</text>
    </g>
  </g>

  <!-- BIDIRECTIONAL AGENT CHANNEL -->
  <path class="lineA" d="M800 266 V310" marker-end="url(#arrow)"/>
  <path class="lineD" d="M840 310 V266" marker-end="url(#arrowMuted)"/>
  <text class="tiny" x="848" y="291">state / results</text>
  <text class="tiny" x="708" y="291">operations</text>

  <!-- CENTER NODE -->
  <g transform="translate(535 322)">
    <rect class="accent-card" width="530" height="300" rx="18"/>
    <circle class="ok" cx="28" cy="28" r="4"/><text class="tiny" x="42" y="32">ONLINE</text>
    <text class="tiny" x="414" y="32">AGENT CONNECTED</text>
    <text class="title" x="24" y="79" style="font-size:25px">node-01</text>
    <text class="subtitle mono" x="24" y="102" style="font-size:12.4px">10.20.4.21 · Linux · x86_64</text>
    <line class="divider" x1="24" y1="122" x2="506" y2="122"/>
    <text class="tiny" x="24" y="148">PRIMARY PATH</text>
    <text class="value mono" x="24" y="170">eth0 → 10.20.4.21 → gateway 10.20.4.1</text>
    <text class="tiny" x="24" y="201">MODEL</text>
    <g transform="translate(24 214)">
      <rect class="chip" width="88" height="26" rx="13"/><text class="chipText" x="18" y="17">Topology</text>
      <rect class="chip" x="98" width="80" height="26" rx="13"/><text class="chipText" x="116" y="17">Ports</text>
      <rect class="chip" x="188" width="88" height="26" rx="13"/><text class="chipText" x="206" y="17">Services</text>
      <rect class="chip" x="286" width="76" height="26" rx="13"/><text class="chipText" x="308" y="17">VPN</text>
      <rect class="chip" x="372" width="96" height="26" rx="13"/><text class="chipText" x="392" y="17">Storage</text>
    </g>
    <line class="divider" x1="24" y1="258" x2="506" y2="258"/>
    <text class="tiny" x="24" y="280">HEALTH</text>
    <circle class="ok" cx="92" cy="276" r="4"/><text class="value" x="104" y="280">Healthy</text>
    <text class="tiny" x="395" y="280">heartbeat 2s ago</text>
  </g>

  <!-- LEFT IDENTITY -->
  <g transform="translate(64 166)">
    <rect class="card" width="346" height="166" rx="14"/>
    <text class="h2" x="20" y="30">Identity</text>
    <text class="tiny" x="20" y="51">WHAT THIS MACHINE IS</text>
    <line class="divider" x1="20" y1="64" x2="326" y2="64"/>
    <text class="body" x="20" y="90">Hostname</text><text class="value mono" x="172" y="90">node-01</text>
    <text class="body" x="20" y="112">OS / Kernel</text><text class="value" x="172" y="112">Debian · 6.12</text>
    <text class="body" x="20" y="134">Architecture</text><text class="value mono" x="172" y="134">x86_64</text>
    <text class="tiny" x="20" y="153">agent v0.1 · uptime 12h 47m · 8 logical CPUs</text>
  </g>

  <!-- LEFT NETWORK TOPOLOGY -->
  <g transform="translate(64 382)">
    <rect class="card" width="410" height="462" rx="14"/>
    <text class="h2" x="20" y="30">Network topology</text>
    <text class="tiny" x="20" y="51">LAN · ROUTES · GATEWAYS · VPN · REMOTE REACHABILITY</text>
    <line class="divider" x1="20" y1="64" x2="390" y2="64"/>

    <!-- local LAN -->
    <text class="tiny" x="20" y="91">LOCAL NETWORK</text>
    <rect class="site" x="20" y="104" width="370" height="132" rx="12"/>

    <g transform="translate(42 126)">
      <rect class="nodeDot" width="92" height="48" rx="9"/>
      <text class="value" x="46" y="20" text-anchor="middle">NAS</text>
      <text class="tiny mono" x="46" y="36" text-anchor="middle">10.20.4.10</text>
    </g>

    <g transform="translate(158 118)">
      <rect class="nodeDotA" width="96" height="64" rx="10"/>
      <circle class="ok" cx="16" cy="16" r="3.5"/>
      <text class="value" x="48" y="27" text-anchor="middle">node-01</text>
      <text class="tiny mono" x="48" y="46" text-anchor="middle">10.20.4.21</text>
    </g>

    <g transform="translate(278 126)">
      <rect class="nodeDot" width="92" height="48" rx="9"/>
      <text class="value" x="46" y="20" text-anchor="middle">Hypervisor</text>
      <text class="tiny mono" x="46" y="36" text-anchor="middle">10.20.4.5</text>
    </g>

    <path class="line" d="M134 150 H158"/>
    <path class="line" d="M254 150 H278"/>

    <rect class="nodeDot" x="160" y="196" width="92" height="28" rx="8"/>
    <text class="tiny" x="206" y="214" text-anchor="middle">gateway 10.20.4.1</text>
    <path class="lineA" d="M206 182 V196" marker-end="url(#arrow)"/>

    <!-- VPN + remote site -->
    <text class="tiny" x="20" y="270">VPN / OVERLAY</text>
    <rect class="site" x="20" y="284" width="370" height="118" rx="12"/>
    <rect class="nodeDotA" x="46" y="316" width="96" height="50" rx="9"/>
    <text class="value mono" x="94" y="336" text-anchor="middle">wg0</text>
    <text class="tiny mono" x="94" y="352" text-anchor="middle">10.8.0.1</text>

    <path class="lineA" d="M142 341 H192" marker-end="url(#arrow)"/>
    <text class="tiny" x="167" y="331" text-anchor="middle">encrypted</text>

    <rect class="nodeDot" x="200" y="302" width="164" height="78" rx="10"/>
    <text class="tiny" x="282" y="322" text-anchor="middle">REMOTE SITE</text>
    <text class="value" x="282" y="343" text-anchor="middle">edge-02 · server-03</text>
    <text class="tiny mono" x="282" y="361" text-anchor="middle">10.8.0.2 · 10.30.0.0/24</text>

    <text class="tiny" x="20" y="420">Remote reachability becomes part of the node model.</text>
    <text class="tiny" x="20" y="438">VPN routes, peers and remote subnets stay linked to the local node.</text>
  </g>

  <!-- RIGHT EXPOSURE -->
  <g transform="translate(1190 166)">
    <rect class="card" width="346" height="188" rx="14"/>
    <text class="h2" x="20" y="30">Exposure</text>
    <text class="tiny" x="20" y="51">LISTENERS · BINDINGS · SERVICES</text>
    <line class="divider" x1="20" y1="64" x2="326" y2="64"/>
    <g transform="translate(20 84)">
      <rect class="portPublic" width="142" height="30" rx="8"/><circle class="ok" cx="14" cy="15" r="3.5"/>
      <text class="value mono" x="27" y="19">:443</text><text class="tiny" x="70" y="19">HTTPS</text>
      <rect class="portPrivate" x="154" width="150" height="30" rx="8"/><circle class="warn" cx="168" cy="15" r="3.5"/>
      <text class="value mono" x="181" y="19">:22</text><text class="tiny" x="215" y="19">SSH</text>
    </g>
    <text class="tiny" x="20" y="141">0.0.0.0:443 → nginx · TLS certificate detected</text>
    <text class="tiny" x="20" y="158">0.0.0.0:22 → sshd · public/private binding context</text>
    <text class="tiny" x="20" y="175">listener → service → endpoint → topology relationship</text>
  </g>

  <!-- RIGHT RUNTIME -->
  <g transform="translate(1190 392)">
    <rect class="card" width="346" height="174" rx="14"/>
    <text class="h2" x="20" y="30">Runtime</text>
    <text class="tiny" x="20" y="51">SERVICES · PROCESSES · CONTAINERS</text>
    <line class="divider" x1="20" y1="64" x2="326" y2="64"/>
    <g transform="translate(20 84)">
      <rect class="port" width="88" height="30" rx="8"/><circle class="ok" cx="14" cy="15" r="3.5"/><text class="value" x="28" y="20">nginx</text>
      <rect class="port" x="98" width="94" height="30" rx="8"/><circle class="ok" cx="112" cy="15" r="3.5"/><text class="value" x="126" y="20">docker</text>
      <rect class="port" x="202" width="102" height="30" rx="8"/><circle class="ok" cx="216" cy="15" r="3.5"/><text class="value" x="230" y="20">api</text>
    </g>
    <text class="tiny" x="20" y="140">12 services · 3 containers · 41 processes</text>
    <text class="tiny" x="20" y="157">service ownership · container mapping · restart state</text>
  </g>

  <!-- RIGHT STORAGE -->
  <g transform="translate(1190 648)">
    <rect class="card" width="346" height="156" rx="14"/>
    <text class="h2" x="20" y="30">Storage</text>
    <text class="tiny" x="20" y="51">DISKS · MOUNTS · VOLUMES</text>
    <line class="divider" x1="20" y1="64" x2="326" y2="64"/>
    <text class="body" x="20" y="92">/</text>
    <rect class="metricTrack" x="86" y="83" width="158" height="8" rx="4"/><rect class="metricFill" x="86" y="83" width="57" height="8" rx="4"/>
    <text class="tiny" x="262" y="92">36%</text>
    <text class="body" x="20" y="121">/data</text>
    <rect class="metricTrack" x="86" y="112" width="158" height="8" rx="4"/><rect class="metricOk" x="86" y="112" width="77" height="8" rx="4"/>
    <text class="tiny" x="262" y="121">49%</text>
    <text class="tiny" x="20" y="143">nvme0n1 · ext4 · /data volume mapping</text>
  </g>

  <!-- CONNECTORS: left -->
  <path class="lineA" d="M535 382 H504 V248 H410"/>
  <path class="lineA" d="M535 486 H504 V594 H474"/>
  <circle class="junction" cx="504" cy="382" r="3"/><circle class="junction" cx="504" cy="486" r="3"/>

  <!-- CONNECTORS: right -->
  <path class="lineA" d="M1065 382 H1124 V248 H1190"/>
  <path class="lineA" d="M1065 462 H1124 V478 H1190"/>
  <path class="lineA" d="M1065 542 H1124 V726 H1190"/>
  <circle class="junction" cx="1124" cy="382" r="3"/><circle class="junction" cx="1124" cy="462" r="3"/><circle class="junction" cx="1124" cy="542" r="3"/>

  <!-- STATE -->
  <g transform="translate(490 676)">
    <rect class="card" width="270" height="150" rx="14"/>
    <text class="h2" x="20" y="30">State</text>
    <text class="tiny" x="20" y="51">HEALTH · METRICS · EVENTS</text>
    <line class="divider" x1="20" y1="64" x2="250" y2="64"/>
    <circle class="ok" cx="24" cy="88" r="4"/><text class="value" x="38" y="92">Healthy</text>
    <text class="tiny" x="20" y="114">heartbeat 2s ago · CPU 14% · RAM 38%</text>
    <text class="tiny" x="20" y="132">0 critical events · update state known</text>
  </g>

  <!-- MANAGEMENT SURFACE -->
  <g transform="translate(780 660)">
    <rect class="future-card" width="356" height="250" rx="15"/>
    <text class="h2" x="20" y="30">Management surface</text>
    <text class="tiny" x="20" y="51">CENTRAL CONTROL · NO NODE-HOPPING REQUIRED</text>
    <line class="divider" x1="20" y1="64" x2="336" y2="64"/>
    <g transform="translate(20 78)">
      <rect class="chipFuture" width="92" height="26" rx="13"/><text class="chipFutureText" x="22" y="17">Terminal</text>
      <rect class="chipFuture" x="102" width="106" height="26" rx="13"/><text class="chipFutureText" x="123" y="17">Expose port</text>
      <rect class="chipFuture" x="218" width="98" height="26" rx="13"/><text class="chipFutureText" x="241" y="17">Service</text>
      <rect class="chipFuture" y="36" width="92" height="26" rx="13"/><text class="chipFutureText" x="22" y="53">Container</text>
      <rect class="chipFuture" x="102" y="36" width="106" height="26" rx="13"/><text class="chipFutureText" x="130" y="53">Route</text>
      <rect class="chipFuture" x="218" y="36" width="98" height="26" rx="13"/><text class="chipFutureText" x="247" y="53">VPN</text>
      <rect class="chipFuture" y="72" width="92" height="26" rx="13"/><text class="chipFutureText" x="25" y="89">Update</text>
      <rect class="chipFuture" x="102" y="72" width="106" height="26" rx="13"/><text class="chipFutureText" x="130" y="89">Deploy</text>
      <rect class="chipFuture" x="218" y="72" width="98" height="26" rx="13"/><text class="chipFutureText" x="244" y="89">Reboot</text>
    </g>
    <line class="divider" x1="20" y1="184" x2="336" y2="184"/>
    <text class="tiny" x="20" y="204">Terminal session · port exposure · route/VPN changes</text>
    <text class="tiny" x="20" y="221">service/container control · deploy/update/reboot</text>
    <text class="tiny" x="20" y="238">all authorized and auditable through the agent channel</text>
  </g>
  <path class="lineD" d="M958 660 V626 H986 V580" marker-end="url(#arrowMuted)"/>
  <text class="tiny" x="995" y="630">commands</text>

  <!-- SECURITY RAIL -->
  <g transform="translate(64 994)">
    <rect class="card2" width="1472" height="74" rx="14"/>
    <text class="tiny" x="20" y="27">SECURITY RAIL</text>
    <rect class="chipOk" x="20" y="38" width="92" height="24" rx="12"/><text class="chipOkText" x="42" y="54">mTLS</text>
    <rect class="chipOk" x="122" y="38" width="130" height="24" rx="12"/><text class="chipOkText" x="145" y="54">Agent identity</text>
    <rect class="chipOk" x="262" y="38" width="140" height="24" rx="12"/><text class="chipOkText" x="285" y="54">Signed releases</text>
    <rect class="chipOk" x="412" y="38" width="146" height="24" rx="12"/><text class="chipOkText" x="437" y="54">SHA-256 verify</text>
    <rect class="chipFuture" x="568" y="38" width="154" height="24" rx="12"/><text class="chipFutureText" x="590" y="54">Central authz</text>
    <rect class="chipFuture" x="732" y="38" width="146" height="24" rx="12"/><text class="chipFutureText" x="754" y="54">Audit trail</text>
    <rect class="chipFuture" x="888" y="38" width="164" height="24" rx="12"/><text class="chipFutureText" x="911" y="54">Controlled terminal</text>
    <text class="tiny" x="1446" y="54" text-anchor="end">self-hosted · least privilege · explicit trust boundaries</text>
  </g>
</svg>