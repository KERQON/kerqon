<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
<title id="title">KERQON architecture overview</title><desc id="desc">Discover, model, understand and control architecture of KERQON.</desc>
<defs>
    <style>
      :root{
        --bg:#0b0f14; --panel:#101720; --panel2:#131b25; --line:#243246; --lineSoft:#1a2533;
        --text:#eef3f9; --muted:#9ba8ba; --faint:#718095; --accent:#4d9fff; --ok:#4fd19a;
        --warn:#e0b260; --danger:#ef7d7d;
      }
      text{font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
      .bg{fill:var(--bg)} .card{fill:var(--panel);stroke:var(--line);stroke-width:1}
      .card2{fill:var(--panel2);stroke:var(--line);stroke-width:1}
      .accent-card{fill:var(--panel2);stroke:var(--accent);stroke-width:1.35}
      .future-card{fill:#0f151e;stroke:#3b4656;stroke-width:1;stroke-dasharray:5 5}
      .divider{stroke:var(--lineSoft);stroke-width:1}
      .eyebrow{fill:var(--accent);font-size:12px;font-weight:700;letter-spacing:2.3px}
      .title{fill:var(--text);font-size:30px;font-weight:740;letter-spacing:-.35px}
      .subtitle{fill:var(--muted);font-size:15px;font-weight:500}
      .h2{fill:var(--text);font-size:14px;font-weight:700}
      .h3{fill:var(--text);font-size:12.5px;font-weight:700}
      .body{fill:var(--muted);font-size:11.5px;font-weight:540}
      .tiny{fill:var(--faint);font-size:10px;font-weight:560}
      .value{fill:var(--text);font-size:11.5px;font-weight:650}
      .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
      .line{fill:none;stroke:#33455d;stroke-width:1.15;stroke-linecap:round;stroke-linejoin:round}
      .lineA{fill:none;stroke:#4d9fff;stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}
      .lineD{fill:none;stroke:#596779;stroke-width:1.1;stroke-dasharray:6 6;stroke-linecap:round}
      .junction{fill:#4d9fff}.ok{fill:var(--ok)}.warn{fill:var(--warn)}.danger{fill:var(--danger)}.accent{fill:var(--accent)}
      .chip{fill:#132033;stroke:#28486d;stroke-width:1}.chipText{fill:#aacbfa;font-size:9.6px;font-weight:650}
      .chipOk{fill:#11241d;stroke:#275845;stroke-width:1}.chipOkText{fill:#8fe1bb;font-size:9.6px;font-weight:650}
      .chipFuture{fill:#141923;stroke:#414b59;stroke-width:1;stroke-dasharray:4 4}.chipFutureText{fill:#909aab;font-size:9.6px;font-weight:650}
      .port{fill:#111923;stroke:#2a3748;stroke-width:1}.portPublic{fill:#13241d;stroke:#2a5d49;stroke-width:1}.portPrivate{fill:#211b11;stroke:#5d4825;stroke-width:1}
      .metricTrack{fill:#1b2634}.metricFill{fill:#4d9fff}.metricOk{fill:#4fd19a}
      .nodeDot{fill:#111923;stroke:#3b516f;stroke-width:1}.nodeDotA{fill:#14243a;stroke:#4d9fff;stroke-width:1.25}
      .site{fill:#0f151e;stroke:#35445a;stroke-width:1;stroke-dasharray:4 4}
      @media (prefers-color-scheme:light){
        :root{--bg:#f7f9fc;--panel:#fff;--panel2:#f5f8fc;--line:#d6e0eb;--lineSoft:#e5ebf2;--text:#101722;--muted:#536276;--faint:#76859a;--accent:#2c78df;--ok:#1f9d6c;--warn:#af7d26;--danger:#c84f4f}
        .chip{fill:#eef5ff;stroke:#c9dcf4}.chipText{fill:#215ea8}.chipOk{fill:#eef9f4;stroke:#bfe7d6}.chipOkText{fill:#177d57}
        .chipFuture{fill:#f6f8fb;stroke:#cad3de}.chipFutureText{fill:#6f7a8b}.port{fill:#f8fafc;stroke:#d8e1eb}
        .portPublic{fill:#eef9f4;stroke:#c0e5d6}.portPrivate{fill:#fff8ec;stroke:#ead6ad}.metricTrack{fill:#edf1f6}
        .line{stroke:#b6c5d7}.lineA{stroke:#4b86ca}.lineD{stroke:#a8b4c2}.future-card{fill:#fbfcfe;stroke:#c8d1dc}
        .nodeDot{fill:#fff;stroke:#c8d6e6}.nodeDotA{fill:#eef5ff;stroke:#2c78df}.site{fill:#fbfcfe;stroke:#cbd4df}
      }
    </style>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#4d9fff"/>
    </marker>
    <marker id="arrowMuted" viewBox="0 0 10 10" refX="8.2" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#596779"/>
    </marker>
  </defs>
<rect class="bg" width="1600" height="1000" rx="24"/>

<text class="eyebrow" x="64" y="52">KERQON ARCHITECTURE</text>
<text class="title" x="64" y="92">Discover → Model → Understand → Control</text>
<text class="subtitle" x="64" y="121">KERQON turns raw node signals into a connected infrastructure model and then into controlled operational actions.</text>

<g transform="translate(64 190)">
 <rect class="card" width="330" height="500" rx="16"/>
 <text class="tiny" x="20" y="30">01 · DISCOVER</text><text class="h2" x="20" y="58">Agent observations</text>
 <line class="divider" x1="20" y1="74" x2="310" y2="74"/>
 <text class="body" x="20" y="105">Identity</text><text class="value" x="150" y="105">host · OS · kernel</text>
 <text class="body" x="20" y="135">Network</text><text class="value" x="150" y="135">IPs · routes · peers</text>
 <text class="body" x="20" y="165">Exposure</text><text class="value" x="150" y="165">listeners · TLS</text>
 <text class="body" x="20" y="195">Runtime</text><text class="value" x="150" y="195">services · containers</text>
 <text class="body" x="20" y="225">Storage</text><text class="value" x="150" y="225">disks · mounts</text>
 <text class="body" x="20" y="255">State</text><text class="value" x="150" y="255">health · metrics</text>
 <line class="divider" x1="20" y1="286" x2="310" y2="286"/>
 <text class="tiny" x="20" y="315">OUTBOUND-INITIATED AGENT CHANNEL</text>
 <text class="body" x="20" y="344">Node-local collection</text>
 <text class="body" x="20" y="368">Versioned schemas</text>
 <text class="body" x="20" y="392">Authenticated identity</text>
 <text class="body" x="20" y="416">No inbound management listener required</text>
</g>

<path class="lineA" d="M394 440 H446" marker-end="url(#arrow)"/>

<g transform="translate(446 190)">
 <rect class="accent-card" width="330" height="500" rx="16"/>
 <text class="tiny" x="20" y="30">02 · MODEL</text><text class="h2" x="20" y="58">Infrastructure graph</text>
 <line class="divider" x1="20" y1="74" x2="310" y2="74"/>
 <rect class="nodeDotA" x="108" y="102" width="114" height="58" rx="10"/><text class="value" x="165" y="128" text-anchor="middle">node-01</text><text class="tiny" x="165" y="146" text-anchor="middle">managed node</text>
 <rect class="nodeDot" x="20" y="204" width="104" height="52" rx="9"/><text class="value" x="72" y="235" text-anchor="middle">Network</text>
 <rect class="nodeDot" x="206" y="204" width="104" height="52" rx="9"/><text class="value" x="258" y="235" text-anchor="middle">Services</text>
 <rect class="nodeDot" x="20" y="318" width="104" height="52" rx="9"/><text class="value" x="72" y="349" text-anchor="middle">Storage</text>
 <rect class="nodeDot" x="206" y="318" width="104" height="52" rx="9"/><text class="value" x="258" y="349" text-anchor="middle">Remote site</text>
 <path class="line" d="M136 160 L92 204 M194 160 L238 204 M136 160 L92 318 M194 160 L238 318"/>
 <text class="tiny" x="20" y="418">Relationships are first-class data:</text>
 <text class="body" x="20" y="445">service → listener → interface → route</text>
 <text class="body" x="20" y="469">node → VPN peer → remote subnet → system</text>
</g>

<path class="lineA" d="M776 440 H828" marker-end="url(#arrow)"/>

<g transform="translate(828 190)">
 <rect class="card" width="330" height="500" rx="16"/>
 <text class="tiny" x="20" y="30">03 · UNDERSTAND</text><text class="h2" x="20" y="58">Operational context</text>
 <line class="divider" x1="20" y1="74" x2="310" y2="74"/>
 <text class="body" x="20" y="108">What is this node?</text><text class="value" x="20" y="132">Identity + lifecycle context</text>
 <text class="body" x="20" y="176">What can reach it?</text><text class="value" x="20" y="200">Exposure + topology</text>
 <text class="body" x="20" y="244">What can it reach?</text><text class="value" x="20" y="268">Routes + VPN + remote networks</text>
 <text class="body" x="20" y="312">What is running?</text><text class="value" x="20" y="336">Services + containers + ports</text>
 <text class="body" x="20" y="380">Is it healthy?</text><text class="value" x="20" y="404">Metrics + events + heartbeat</text>
 <text class="body" x="20" y="448">What changed?</text><text class="value" x="20" y="472">State history + audit context</text>
</g>

<path class="lineA" d="M1158 440 H1210" marker-end="url(#arrow)"/>

<g transform="translate(1210 190)">
 <rect class="future-card" width="326" height="500" rx="16"/>
 <text class="tiny" x="20" y="30">04 · CONTROL</text><text class="h2" x="20" y="58">Authorized operations</text>
 <line class="divider" x1="20" y1="74" x2="306" y2="74"/>
 <g transform="translate(20 100)">
  <rect class="chipFuture" width="130" height="30" rx="15"/><text class="chipFutureText" x="43" y="19">Terminal</text>
  <rect class="chipFuture" x="142" width="144" height="30" rx="15"/><text class="chipFutureText" x="174" y="19">Expose port</text>
  <rect class="chipFuture" y="44" width="130" height="30" rx="15"/><text class="chipFutureText" x="47" y="63">Service</text>
  <rect class="chipFuture" x="142" y="44" width="144" height="30" rx="15"/><text class="chipFutureText" x="180" y="63">Container</text>
  <rect class="chipFuture" y="88" width="130" height="30" rx="15"/><text class="chipFutureText" x="52" y="107">Route</text>
  <rect class="chipFuture" x="142" y="88" width="144" height="30" rx="15"/><text class="chipFutureText" x="197" y="107">VPN</text>
  <rect class="chipFuture" y="132" width="130" height="30" rx="15"/><text class="chipFutureText" x="48" y="151">Deploy</text>
  <rect class="chipFuture" x="142" y="132" width="144" height="30" rx="15"/><text class="chipFutureText" x="190" y="151">Update</text>
 </g>
 <line class="divider" x1="20" y1="294" x2="306" y2="294"/>
 <text class="tiny" x="20" y="324">SECURITY BOUNDARY</text>
 <text class="body" x="20" y="351">authorization before execution</text>
 <text class="body" x="20" y="377">target + operation explicitly scoped</text>
 <text class="body" x="20" y="403">result returned through agent channel</text>
 <text class="body" x="20" y="429">operator action recorded for audit</text>
</g>

<g transform="translate(64 750)">
 <rect class="card2" width="1472" height="98" rx="14"/>
 <text class="tiny" x="20" y="29">KERQON DATA FLOW</text>
 <text class="value" x="20" y="60">Raw node signals</text><text class="tiny" x="164" y="60">→</text>
 <text class="value" x="190" y="60">versioned contracts</text><text class="tiny" x="352" y="60">→</text>
 <text class="value" x="378" y="60">infrastructure graph</text><text class="tiny" x="548" y="60">→</text>
 <text class="value" x="574" y="60">operational context</text><text class="tiny" x="738" y="60">→</text>
 <text class="value" x="764" y="60">authorized action</text><text class="tiny" x="913" y="60">→</text>
 <text class="value" x="939" y="60">auditable result</text>
</g>

</svg>